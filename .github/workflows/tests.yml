name: Continuous Integration & Compliance Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov jsonschema regex flake8 black mypy

      - name: Verify Official NIST OSCAL Schema Presence
        run: |
          if [ ! -f oscal_catalog_schema.json ]; then
            echo "Fetching NIST OSCAL Catalog Schema (v1.1.1)..."
            curl -L -o oscal_catalog_schema.json https://github.com/usnistgov/OSCAL/releases/download/v1.1.1/oscal_catalog_schema.json
          fi

      - name: Code Formatting Check (Black)
        run: |
          black --check src/ tests/ --line-length=100

      - name: Linting & PEP 8 Style Check (Flake8)
        run: |
          flake8 src/ tests/ --max-line-length=100

      - name: Static Type Checking (Mypy)
        run: |
          mypy src/ tests/

      - name: Execute Full Test Suite with Coverage
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload Coverage Artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: htmlcov/
          retention-days: 14
