[core]
dags_folder = src/pipeline/dags
base_log_folder = airflow/logs
executor = SequentialExecutor
sql_alchemy_conn = sqlite:///airflow/airflow.db
load_examples = False
donot_pickle = True
dagbag_import_timeout = 30.0
default_timezone = utc

[webserver]
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080
secret_key = compliance-monitoring-pipeline-secret-key
workers = 2
worker_class = sync
access_logfile = airflow/logs/webserver_access.log
error_logfile = airflow/logs/webserver_error.log

[scheduler]
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
min_file_process_interval = 10
dag_dir_list_interval = 30
catchup_by_default = False
max_threads = 2

[logging]
logging_level = INFO
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
